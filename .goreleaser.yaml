# Release build for the junkie terminal client.
#
# The command is `junkie` but the package is ./cmd/junkie-cli, because
# ./cmd/junkie is the server. `binary:` is what makes that invisible to
# anyone installing a release — the archive contains a binary called junkie.
# (`go install` cannot: it names the binary after the directory, which is why
# the README documents that route as junkie-cli.)
version: 2

project_name: junkie

builds:
  - id: junkie
    main: ./cmd/junkie-cli
    binary: junkie
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # main.version is printed by `junkie version`; -s -w drop the symbol
    # table and DWARF, which the server build already does.
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: junkie
    # Predictable names, because install.sh builds the URL rather than
    # querying the release API for it.
    name_template: "junkie_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  # The server, the web app and the terminal client share this tree, and the
  # commit subjects carry no scope prefixes -- so no pattern reliably tells a
  # CLI commit from a room-settings one. (The `^web:`/`^docs:` filters this
  # replaces matched nothing for that reason.) Generating from tag history is
  # worse than useless here: the first v* tag follows `android`, 148 commits
  # back, nearly all of them server work. Release notes are written by hand.
  disable: true

release:
  name_template: "junkie {{ .Version }}"
  # Every release page should say how to install what is on it, whatever the
  # hand-written notes above it happen to cover.
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/samnodier/junkie/master/install.sh | sh
    ```

    Puts a `junkie` binary in `~/.local/bin` (set `JUNKIE_INSTALL_DIR` to
    choose elsewhere) and verifies it against `checksums.txt` below. Works on
    macOS and on any Linux distribution, WSL included — the binaries are
    static, so there is no glibc requirement. On Windows, download
    `junkie_windows_amd64.zip` and put `junkie.exe` on your PATH.

    Re-running the same command upgrades in place.
