# Publishes the junkie terminal client when a version tag is pushed.
#
# Only v* tags trigger it: this repository already carries non-version tags
# (`android`, from the TWA build), and those must not cut a CLI release.
name: release-cli

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the version and changelog from tag history,
          # which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Two server tests read the built frontend out of the go:embed bundle
      # (the SPA shell, and the link-preview tags in index.html), and
      # cmd/junkie/static/app is gitignored -- the Dockerfile builds it, a
      # fresh checkout does not have it. So build it here, or `go test ./...`
      # below fails on a release that is perfectly fine.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build

      # The server's tests run here too: the CLI shares its module, so a
      # release that would not build or pass is worth catching before it is
      # published rather than after.
      - run: go test ./... -race

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
