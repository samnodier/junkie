<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Kept short on purpose: this is the tab title on every route, and
       pipWindow.js copies it into the pop-out timer's window title. The
       descriptive wording lives in the description and og:title below,
       which is where search snippets and link previews read from. -->
  <title>junkie</title>
  <meta name="description" content="A small shared focus app for study groups. Run a focus timer with friends, keep a shared todo list, and check in when the block ends.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <script>
    (function () {
      var k = 'junkie:theme';
      var t = localStorage.getItem(k);
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F0E6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121712">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="junkie">

  <!-- Link previews, mainly for the room invites people paste into Discord.
       Absolute URLs are required: scrapers do not resolve relative paths.
       There is deliberately no rel="canonical" here — this one file is served
       for every route, so a hard-coded canonical would tell search engines
       that /privacy and /terms are the home page. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="junkie">
  <meta property="og:title" content="junkie — a shared focus app for study groups">
  <meta property="og:description" content="Run a focus timer with friends, keep a shared todo list, and check in when the block ends.">
  <meta property="og:url" content="https://junkie-blin.onrender.com/">
  <meta property="og:image" content="https://junkie-blin.onrender.com/assets/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The junkie wordmark beside a focus timer ring, on a cream grid background.">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="junkie — a shared focus app for study groups">
  <meta name="twitter:description" content="Run a focus timer with friends, keep a shared todo list, and check in when the block ends.">
  <meta name="twitter:image" content="https://junkie-blin.onrender.com/assets/og-image.png">
  <meta name="twitter:image:alt" content="The junkie wordmark beside a focus timer ring, on a cream grid background.">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
