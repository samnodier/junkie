services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: junkie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-junkie}
      POSTGRES_DB: junkie
    ports:
      # Bound to loopback so the database is never reachable from other hosts.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U junkie -d junkie"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Containerized app for deployment. Not started by default; run with:
  #   docker compose --profile app up -d --build     (app only, no TLS)
  #   docker compose --profile prod up -d --build    (app + Caddy TLS proxy)
  # Local dev keeps using `go run ./cmd/junkie` against the postgres service.
  app:
    build: .
    profiles: ["app", "prod"]
    environment:
      DATABASE_URL: postgres://junkie:${POSTGRES_PASSWORD:-junkie}@postgres:5432/junkie?sslmode=disable
      ADDR: :8080
      JUNKIE_OWNER_USERNAME: ${JUNKIE_OWNER_USERNAME:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # TLS-terminating reverse proxy for production (see DEPLOY.md). Caddy
  # obtains and renews Let's Encrypt certificates for $DOMAIN automatically
  # and forwards X-Forwarded-Proto/For, which the app already honors.
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    environment:
      # Required in production; the localhost fallback only exists so the
      # compose file stays valid for local runs without DOMAIN in .env.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
