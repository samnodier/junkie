services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: junkie
      POSTGRES_PASSWORD: junkie
      POSTGRES_DB: junkie
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U junkie -d junkie"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
