services:
  # No local postgres service here — DATABASE_URL points at a managed
  # database (e.g. Neon) instead. See "Self-hosting with Docker" in DEPLOY.md.
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADDR: :8080
      JUNKIE_OWNER_USERNAME: ${JUNKIE_OWNER_USERNAME:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
